<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator studio — Worth The Trip</title>
  <link rel="stylesheet" href="/src/css/styles.css?v=37">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="icon" href="/public/Branding/WTT Logo 1.svg">
  <style>
    :root { --app-bg: #0d0d0d; --field-bg: #1A1A1A; --panel-bg: #1E1E1E; --danger: #b3261e; }
    [data-theme="light"] { --app-bg: #F5F2ED; --field-bg: #FFFFFF; --panel-bg: #FFFFFF; }
    * { box-sizing: border-box; }
    /* styles.css sets html, body { height:100%; overflow:hidden } for the
       full-screen map app. These are normal document pages, so restore
       ordinary page scrolling — otherwise long forms are unreachable. */
    html, body { height: auto; overflow-y: auto; overflow-x: hidden; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--app-bg);
      color: var(--foreground);
      min-height: 100vh;
    }
    a { color: var(--accent); }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 20px 16px 80px; }

    .card {
      background: var(--panel-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 22px; margin-bottom: 16px;
    }
    .card h1 { margin: 0 0 4px; font-size: 22px; }
    .card h2 { margin: 0 0 4px; font-size: 19px; }
    .sub { color: var(--muted-foreground); margin: 0 0 16px; font-size: 14px; }
    .section-title { font-size: 15px; font-weight: 700; margin: 0 0 14px; letter-spacing: .01em; }
    .hint { font-size: 12.5px; color: var(--muted-foreground); margin-top: 6px; line-height: 1.5; }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; color: var(--muted-foreground); margin-bottom: 6px; font-weight: 600; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--field-bg); color: var(--foreground); font-size: 15px; font-family: inherit;
    }
    .field textarea { min-height: 78px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    @media (max-width: 620px) { .row2, .row3 { grid-template-columns: 1fr; } }

    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 16px; border: 1px solid transparent; border-radius: 9px; cursor: pointer;
      font-weight: 600; font-size: 14px; font-family: inherit; background: var(--field-bg); color: var(--foreground);
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { background: var(--field-bg); color: var(--foreground); border-color: var(--border); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-sm { padding: 7px 11px; font-size: 13px; }
    .btn[disabled] { opacity: .5; cursor: not-allowed; }

    .pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--field-bg); color: var(--muted-foreground); border: 1px solid var(--border); }
    .pill.green { background: #1b5e20; color: #fff; border-color: transparent; }
    .pill.yellow { background: #f9a825; color: #3a2c00; border-color: transparent; }
    .pill.orange { background: #e65100; color: #fff; border-color: transparent; }
    .pill.red { background: var(--danger); color: #fff; border-color: transparent; }

    .table-wrap { overflow-x: auto; }
    .table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .table th, .table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .table th { color: var(--muted-foreground); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .empty { color: var(--muted-foreground); text-align: center; padding: 26px 0; }

    .error { color: var(--danger); background: rgba(179,38,30,.08); border: 1px solid rgba(179,38,30,.28); padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
    .error:empty { display: none; }
    .problems { border: 1px solid rgba(249,168,37,.4); background: rgba(249,168,37,.08); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; margin-top: 14px; }
    .problems ul { margin: 6px 0 0; padding-left: 18px; }
    .problems li { margin: 3px 0; }
    .ok-note { border: 1px solid rgba(27,94,32,.4); background: rgba(27,94,32,.10); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; margin-top: 14px; }

    .months { display: flex; flex-wrap: wrap; gap: 6px; }
    .month { position: relative; }
    .month input { position: absolute; opacity: 0; width: 0; height: 0; }
    .month span {
      display: inline-block; padding: 6px 11px; border: 1px solid var(--border); border-radius: 999px;
      font-size: 12.5px; cursor: pointer; background: var(--field-bg); color: var(--muted-foreground); font-weight: 600;
    }
    .month input:checked + span { background: var(--accent); color: #fff; border-color: var(--accent); }

    .stop {
      border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px;
      background: var(--field-bg);
    }
    .stop-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .stop-num {
      width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex: 0 0 auto;
    }
    .stop-head .stop-name { font-weight: 700; font-size: 14px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Cover preview — the same 16:10 crop the guide page uses, so what the
       creator sees here is what ships. Fixed height means a failed image can
       never collapse the box to a sliver. */
    #cover-preview {
      width: 100%; max-width: 240px; aspect-ratio: 16 / 10;
      border-radius: 8px; overflow: hidden; margin-top: 8px;
      border: 1px solid var(--border); background: var(--field-bg);
      display: flex; align-items: center; justify-content: center;
    }
    #cover-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb-empty {
      display: flex; align-items: center; justify-content: center; height: 100%; width: 100%;
      color: var(--muted-foreground); font-size: 12.5px; text-align: center; padding: 8px;
    }

    #pin-map { height: 320px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
    .coords-readout { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; color: var(--muted-foreground); margin-top: 8px; }
    .link-row { display: flex; gap: 8px; align-items: center; }
    .link-row input { flex: 1; min-width: 0; }
    .link-row .btn { flex: 0 0 auto; }

    .price-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .price-row input[type=range] { flex: 1; min-width: 200px; accent-color: var(--accent); }
    .price-val { font-size: 22px; font-weight: 700; min-width: 96px; }

    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; padding: 12px 20px; border-radius: 8px; font-weight: 600; z-index: 9999; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90vw; text-align: center; }
    .toast.show { opacity: 1; }
    .toast.err { background: var(--danger); }

    .page-header { display: flex; align-items: center; gap: 12px; }
    .page-header .page-title { font-weight: 700; font-size: 15px; flex: 1; }
    .mini-select {
      padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--field-bg); color: var(--foreground); font-family: inherit; font-size: 13px; font-weight: 600;
    }
    .preview-box { border: 1px solid var(--border); border-radius: 10px; padding: 16px; background: var(--field-bg); }
    .preview-box img { max-width: 100%; border-radius: 8px; }
    .inc-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .inc-row input { flex: 1; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--field-bg); color: var(--foreground); font-family: inherit; font-size: 14px; }
    .ja-block { border-top: 1px dashed var(--border); margin-top: 14px; padding-top: 14px; }
  </style>
</head>
<body>

  <header class="page-header">
    <button class="back-btn" id="page-back-btn">← Back</button>
    <span class="page-title" id="page-title">Creator studio</span>
    <select class="mini-select" id="lang-select" aria-label="Language">
      <option value="en">EN</option>
      <option value="ja">日本語</option>
    </select>
    <button class="mini-select" id="theme-btn" aria-label="Toggle theme">🌙</button>
  </header>

  <div class="wrap">
    <div id="gate-view" style="display:none"></div>
    <div id="list-view" style="display:none"></div>
    <div id="editor-view" style="display:none"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="src/js/creator.js?v=12"></script>
</body>
</html>
