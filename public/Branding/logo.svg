<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <defs>
    <!-- Drop shadow for depth -->
    <filter id="pinShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer pin shape — thick red border -->
  <path d="M50 4
           C24.5 4 4 24.5 4 50
           C4 72.5 23.5 91 50 100
           C76.5 91 96 72.5 96 50
           C96 24.5 75.5 4 50 4 Z"
        fill="#D32F2F"
        stroke="#D32F2F"
        stroke-width="3"
        filter="url(#pinShadow)"
        stroke-linejoin="round"/>

  <!-- Inner white teardrop cutout for contrast -->
  <path d="M50 12
           C30.6 12 14 30 14 50
           C14 66.5 29 81 50 88
           C71 81 86 66.5 86 50
           C86 30 69.4 12 50 12 Z"
        fill="white"/>

  <!-- Question mark (upper half) -->
  <path d="M44 32
           C44 26 47 23 50 23
           C53 23 56 26 56 30
           C56 33 54 35 53 37
           L53 42
           L47 42
           L47 39
           C44 39 42 36 42 32
           C42 29 43 27 44 26
           C45 25 46 25 47 25
           L52 25
           C54 25 55 26 55 28
           C55 30 54 32 54 32
           L54 32"
        fill="none"
        stroke="#D32F2F"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Small dot under question mark -->
  <circle cx="50" cy="47" r="2" fill="#D32F2F"/>

  <!-- Torii gate (below the question mark, centered) -->
  <g transform="translate(50, 64)" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left pillar -->
    <path d="M-12 0 L-12 14"/>
    <path d="M-12 0 C-12 -1 -13 -2 -13 -3"/>
    <path d="M-12 14 C-12 15 -13 15 -13 15"/>

    <!-- Right pillar -->
    <path d="M12 0 L12 14"/>
    <path d="M12 0 C12 -1 13 -2 13 -3"/>
    <path d="M12 14 C12 15 13 15 13 15"/>

    <!-- Upper lintel (curved — kasagi) -->
    <path d="M-14 -3 C-14 -7 14 -7 14 -3"/>
    <path d="M-14 -3 C-14 -2 -13 -2 -12 -2"/>
    <path d="M14 -3 C14 -2 13 -2 12 -2"/>

    <!-- Second lintel (nuki — straight) -->
    <line x1="-11" y1="4" x2="11" y2="4"/>
  </g>

  <!-- Red sun circle (between the torii pillars) -->
  <circle cx="50" cy="64" r="5" fill="#D32F2F"/>
</svg>
