<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Worth The Trip</title>
  <link rel="stylesheet" href="/src/css/styles.css?v=45">
  <link rel="icon" href="/public/Branding/WTT Logo 1.svg">
  <style>
    * { box-sizing: border-box; }
    /* styles.css locks html/body scrolling for the full-screen map app.
       This is a normal document page, so restore page scrolling. */
    html, body { height: auto; overflow-y: auto; overflow-x: hidden; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--app-bg, #0d0d0d);
      color: var(--foreground);
      min-height: 100vh;
    }
    a { color: var(--accent); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 22px; margin-bottom: 16px; }
    .card h1 { margin: 0 0 4px; font-size: 22px; }
    .card .sub { color: var(--muted-foreground); margin-bottom: 16px; }

    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .tab {
      flex: 1 1 160px; padding: 12px; text-align: center; border: 1px solid var(--border);
      border-radius: 8px; cursor: pointer; font-weight: 600; background: var(--surface);
      color: var(--foreground);
    }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .tab[data-tab] { cursor: pointer; }
    .tab[aria-selected="true"] { background: var(--accent); color: #fff; }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; color: var(--muted-foreground); margin-bottom: 6px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface); color: var(--foreground); font-size: 15px; font-family: inherit;
    }
    .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }

    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; border: none; border-radius: 9px; cursor: pointer; font-weight: 600; text-decoration: none; font-size: 15px; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { background: var(--surface); color: var(--foreground); }
    .btn-danger { background: #b3261e; color: #fff; }
    .btn-sm { padding: 8px 12px; font-size: 13px; }

    .table-wrap { overflow-x: auto; }
    .table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .table th, .table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .table th { color: var(--muted-foreground); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .table tr:hover { background: var(--surface); }
    .avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); }

    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: var(--surface); color: var(--muted-foreground); }
    .pill.green { background: #1b5e20; color: #fff; }
    .pill.yellow { background: #f9a825; color: #fff; }
    .pill.orange { background: #e65100; color: #fff; }

    .action-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .edit-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .edit-form input, .edit-form select { width: auto; }
    .empty { color: var(--muted-foreground); text-align: center; padding: 24px 0; }

    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; padding: 12px 20px; border-radius: 8px; font-weight: 600; z-index: 999; opacity: 0; transition: opacity .25s; }
    .toast.show { opacity: 1; }

    .login-box { max-width: 420px; margin: 8vh auto; }
    .login-box h1 { text-align: center; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.62); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .modal { width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
    .modal h2 { margin: 0 0 14px; font-size: 19px; }
    .modal .hint { color: var(--muted-foreground); font-size: 13px; font-weight: 400; }
  </style>
</head>
<body>

  <header class="page-header">
    <button class="back-btn" id="page-back-btn">← Back</button>
  </header>

  <div class="wrap">

    <div id="login-view" class="card login-box">
      <h1>Admin login</h1>
      <form id="admin-login-form">
        <div class="field">
          <label>Password</label>
          <input id="admin-password" type="password" required autocomplete="current-password">
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" type="submit">Log in</button>
        </div>
      </form>
    </div>

    <div id="admin-view" style="display:none">
      <div class="card">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
          <div>
            <h1>Admin dashboard</h1>
            <p class="sub">Users, purchases, and creator applications — all from one place.</p>
          </div>
          <button class="btn btn-ghost btn-sm" id="logout-btn">Log out</button>
        </div>
      </div>

      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="users">Users</button>
        <button class="tab" data-tab="purchases">Purchases</button>
        <button class="tab" data-tab="freeguides">Free guides</button>
        <button class="tab" data-tab="guides">Guides</button>
        <button class="tab" data-tab="creators">Creators</button>
        <button class="tab" data-tab="bookings">Bookings</button>
      </div>

      <div class="action-row" style="margin-top:12px;">
        <button class="btn btn-outline" id="btn-cleanup-stale">Clean stale files</button>
        <span class="hint" id="cleanup-status" style="color:var(--muted-foreground);"></span>
      </div>
      <div id="panel-users"></div>
      <div id="panel-purchases"></div>
      <div id="panel-freeguides"></div>
      <div id="panel-guides"></div>
      <div id="panel-creators"></div>
      <div id="panel-bookings"></div>
    </div>

  </div>

  <div class="modal-overlay" id="user-modal">
    <div class="modal card">
      <h2 id="user-modal-title">Edit user</h2>
      <form id="user-edit-form">
        <input type="hidden" id="um-id">
        <div class="field">
          <label for="um-name">Name</label>
          <input id="um-name" required>
        </div>
        <div class="field">
          <label for="um-email">Email</label>
          <input id="um-email" type="email" required>
        </div>
        <div class="field">
          <label for="um-phone">Phone</label>
          <input id="um-phone">
        </div>
        <div class="field">
          <label for="um-address">Address</label>
          <input id="um-address">
        </div>
        <div class="field">
          <label for="um-password">New password <span class="hint">— leave blank to keep the current one</span></label>
          <input id="um-password" type="password" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="um-guide-assign">Assign guide (searchable)</label>
          <input id="um-guide-assign" list="guide-options" placeholder="Start typing a guide title...">
          <datalist id="guide-options"></datalist>
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" type="submit">Save changes</button>
          <button class="btn btn-ghost" type="button" id="um-promote-creator">Promote to Creator</button>
          <button class="btn btn-ghost" type="button" id="um-assign-guide">Assign Guide</button>
          <button class="btn btn-ghost" type="button" id="um-cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="src/js/admin.js?v=7"></script>
</body>
</html>
